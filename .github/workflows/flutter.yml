name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test-build:
    name: Analyze, Test & Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name memochat .

      - name: Configure Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('android/app/build.gradle')
          text = path.read_text()

          text = re.sub(r'compileSdk(?:Version)?\s*=\s*\d+', 'compileSdk = 35', text, count=1)
          text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', text, count=1)

          if 'coreLibraryDesugaringEnabled true' not in text:
              text = text.replace(
                  'compileOptions {',
                  'compileOptions {\n        coreLibraryDesugaringEnabled true',
                  1,
              )

          dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if dependency not in text:
              match = re.search(r'(?m)^dependencies\s*\{', text)
              if not match:
                  raise SystemExit('No Gradle dependencies block found')
              insert_at = match.end()
              text = text[:insert_at] + '\n    ' + dependency + text[insert_at:]

          path.write_text(text)
          PY

          grep -nE 'compileSdk|coreLibraryDesugaring' android/app/build.gradle

      - name: Create google-services.json
        env:
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json << EOF
          {
            "project_info": {
              "project_number": "448753275014",
              "project_id": "memo-f97b5",
              "storage_bucket": "memo-f97b5.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:448753275014:android:e4dedb02a3b10cce9f0107",
                  "android_client_info": {
                    "package_name": "com.memo.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "$FIREBASE_ANDROID_API_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Create secrets.dart
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
          NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
          NEXTCLOUD_PASSWORD: ${{ secrets.NEXTCLOUD_PASSWORD }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: |
          mkdir -p lib/core/config
          cat > lib/core/config/secrets.dart << EOF
          class Secrets {
            Secrets._();

            static const String livekitUrl = '$LIVEKIT_URL';
            static const String livekitApiKey = '$LIVEKIT_API_KEY';
            static const String livekitApiSecret = '$LIVEKIT_API_SECRET';

            static const String nextcloudUrl = '$NEXTCLOUD_URL';
            static const String nextcloudUser = '$NEXTCLOUD_USER';
            static const String nextcloudPassword = '$NEXTCLOUD_PASSWORD';

            static const String firebaseProjectId = 'memo-f97b5';
            static const String firebaseStorageBucket =
                'memo-f97b5.firebasestorage.app';
            static const String firebaseApiKey = '$FIREBASE_ANDROID_API_KEY';
            static const String firebaseAppId =
                '1:448753275014:android:e4dedb02a3b10cce9f0107';
            static const String androidPackageName = 'com.memo.app';
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: |
          mkdir -p build/icon
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon/icon_app.svg -o assets/icon/icon_app.png
          dart run flutter_launcher_icons

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/
        continue-on-error: true

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build Fat APK (universal)
        run: flutter build apk --release --no-pub

      - name: Build Split APKs (per ABI)
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Show artifact sizes
        run: |
          echo "Artifact sizes:"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
