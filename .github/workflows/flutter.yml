jobs:
  analyze-test-build:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ═══════════════════════════════════════════════════
      # Restore the known-good Android project baseline from cc2218c
      # ═══════════════════════════════════════════════════
      - name: Restore stable Android project configuration
        run: |
          flutter create --platforms=android --project-name memochat --org com.memo .

          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle')
          text = path.read_text()
          text = text.replace('namespace = "com.memo.memochat"', 'namespace = "com.memo.app"')
          text = text.replace('namespace "com.memo.memochat"', 'namespace "com.memo.app"')
          text = re.sub(r'(?m)^\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?.*
          lines = text.splitlines()
          output = []
          inserted_min = False
          inserted_desugar = False
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('compileSdk'):
                  output.append('    compileSdk 35')
                  continue
              if stripped.startswith('minSdk'):
                  output.append('        minSdk 23')
                  inserted_min = True
                  continue
              if stripped.startswith('applicationId'):
                  output.append('        applicationId "com.memo.app"')
                  continue
              if stripped == 'compileOptions {':
                  output.append(line)
                  output.append('        coreLibraryDesugaringEnabled true')
                  inserted_desugar = True
                  continue
              output.append(line)
          if not inserted_min:
              for i, line in enumerate(output):
                  if line.strip() == 'defaultConfig {':
                      output.insert(i + 1, '        minSdk 23')
                      inserted_min = True
                      break
          if not inserted_desugar:
              raise SystemExit('Could not locate compileOptions block')
          if not inserted_min:
              raise SystemExit('Could not configure minSdk')
          text = '\n'.join(output) + '\n'
          dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if 'com.android.tools:desugar_jdk_libs:2.1.4' not in text:
              text = text.rstrip() + '\n\ndependencies {\n' + dependency + '\n}\n'
          path.write_text(text)
          PY

          mkdir -p android/app/src/main/kotlin/com/memo/app
          if [ -f android/app/src/main/kotlin/com/memo/memochat/MainActivity.kt ]; then
            sed 's/^package com\.memo\.memochat$/package com.memo.app/' android/app/src/main/kotlin/com/memo/memochat/MainActivity.kt > android/app/src/main/kotlin/com/memo/app/MainActivity.kt
            rm -rf android/app/src/main/kotlin/com/memo/memochat
          fi

          grep -nE 'namespace|applicationId' android/app/build.gradle
          grep -R -n '^package ' android/app/src/main/kotlin || true
          grep -nE 'compileSdk|minSdk|applicationId|coreLibraryDesugaring' android/app/build.gradle

      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "/usr/local/lib/android/sdk/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure stable release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' not in s:
              signing_block = [
                  '    def signingPropertiesFile = rootProject.file("key.properties")',
                  '    def signingProperties = new Properties()',
                  '    if (signingPropertiesFile.exists()) {',
                  '        signingProperties.load(new FileInputStream(signingPropertiesFile))',
                  '    }',
                  '',
                  '    signingConfigs {',
                  '        release {',
                  '            if (signingPropertiesFile.exists()) {',
                  '                storeFile rootProject.file(signingProperties["storeFile"])',
                  '                storePassword signingProperties["storePassword"]',
                  '                keyAlias signingProperties["keyAlias"]',
                  '                keyPassword signingProperties["keyPassword"]',
                  '            }',
                  '        }',
                  '    }',
              ]
              s = s.replace('android {', 'android {\n' + '\n'.join(signing_block), 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace(
                  'buildTypes {',
                  'buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }',
                  1,
              )
          p.write_text(s)
          PY
          grep -nE 'signingConfigs|signingConfig|storeFile|keyAlias' android/app/build.gradle

      # Inject secrets (from env above — NOT from GitHub Secrets)
      # ═══════════════════════════════════════════════════
      - name: Inject google-services.json
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          echo "✅ google-services.json injected"
          grep -c "certificate_hash" android/app/google-services.json

      - name: Inject release keystore
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["KEYSTORE_BASE64"].strip()
          if not raw:
              raise SystemExit("KEYSTORE_BASE64 is empty")

          # Keep the workflow value unchanged; tolerate missing Base64 padding only.
          padding = "=" * ((4 - len(raw) % 4) % 4)
          try:
              decoded = base64.b64decode(raw + padding, validate=True)
          except Exception as exc:
              raise SystemExit(f"KEYSTORE_BASE64 is not valid Base64: {exc}")

          if not decoded:
              raise SystemExit("Decoded keystore is empty")

          Path("android/app/memochat-release.jks").write_bytes(decoded)
          PY
          test -s android/app/memochat-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/memochat-release.jks
          EOF
          echo "✅ keystore + key.properties injected"
          ls -lh android/app/memochat-release.jks

      - name: Inject secrets.dart
        run: |
          mkdir -p lib/core/config
          cat > lib/core/config/secrets.dart <<EOF
          class Secrets {
            Secrets._();
            static const String livekitUrl = '$LIVEKIT_URL';
            static const String livekitApiKey = '$LIVEKIT_API_KEY';
            static const String livekitApiSecret = '$LIVEKIT_API_SECRET';
            static const String nextcloudUrl = '$NEXTCLOUD_URL';
            static const String nextcloudUser = '$NEXTCLOUD_USER';
            static const String nextcloudPassword = '$NEXTCLOUD_PASSWORD';
            static const String firebaseProjectId = '$FIREBASE_PROJECT_ID';
            static const String firebaseStorageBucket = '$FIREBASE_STORAGE_BUCKET';
            static const String firebaseApiKey = '$FIREBASE_API_KEY';
            static const String firebaseAppId = '$FIREBASE_MOBILE_SDK_APP_ID';
            static const String androidPackageName = '$FIREBASE_ANDROID_PACKAGE';
          }
          EOF
          echo "✅ secrets.dart injected"

      - name: Verify Android project
        run: |
          test -f android/app/build.gradle         || { echo "❌ android/app/build.gradle missing"; exit 1; }
          test -f android/app/google-services.json || { echo "❌ google-services.json missing"; exit 1; }
          test -f android/app/memochat-release.jks || { echo "❌ keystore missing"; exit 1; }
          test -f android/key.properties           || { echo "❌ key.properties missing"; exit 1; }
          test -f lib/core/config/secrets.dart     || { echo "❌ secrets.dart missing"; exit 1; }
          echo "✅ All injected files verified"

      # ═══════════════════════════════════════════════════
      # Analysis & Tests
      # ═══════════════════════════════════════════════════
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test --no-pub --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # ═══════════════════════════════════════════════════
      # Build
      # ═══════════════════════════════════════════════════
      - name: Build Universal APK
        run: |
          flutter build apk --release --no-pub \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_API_KEY"

      - name: Build Split APKs
        run: |
          flutter build apk --release --split-per-abi --no-pub \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_API_KEY"

      - name: Build App Bundle
        run: |
          flutter build appbundle --release --no-pub \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_API_KEY"

      - name: Verify signatures
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "→ $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -3
          done

      - name: Show sizes
        run: |
          echo "═══════════════════════════════════"
          ls -lh build/app/outputs/flutter-apk/
          ls -lh build/app/outputs/bundle/release/
          echo "═══════════════════════════════════"

      # ═══════════════════════════════════════════════════
      # Upload
      # ═══════════════════════════════════════════════════
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Universal
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      # ═══════════════════════════════════════════════════
