jobs:
  analyze-test-build:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ═══════════════════════════════════════════════════════
      # Restore Android scaffolding
      # ═══════════════════════════════════════════════════════
      - name: Restore Android project scaffolding
        run: |
          flutter create --platforms=android --no-pub .
          test -f android/app/build.gradle
          test -f android/settings.gradle
          test -f android/build.gradle
          echo "✅ Android scaffolding restored"

      # ═══════════════════════════════════════════════════════
      # Inject all secrets
      # ═══════════════════════════════════════════════════════
      - name: Inject google-services.json
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          echo "✅ google-services.json injected"

      - name: Inject release keystore
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/memochat-release.jks
          test -s android/app/memochat-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/memochat-release.jks
          EOF
          echo "✅ keystore + key.properties injected"

      - name: Inject secrets.dart
        run: |
          mkdir -p lib/core/config
          cat > lib/core/config/secrets.dart <<EOF
          class Secrets {
            Secrets._();
            static const String livekitUrl = '$LIVEKIT_URL';
            static const String livekitApiKey = '$LIVEKIT_API_KEY';
            static const String livekitApiSecret = '$LIVEKIT_API_SECRET';
            static const String nextcloudUrl = '$NEXTCLOUD_URL';
            static const String nextcloudUser = '$NEXTCLOUD_USER';
            static const String nextcloudPassword = '$NEXTCLOUD_PASSWORD';
            static const String firebaseProjectId = '$FIREBASE_PROJECT_ID';
            static const String firebaseStorageBucket = '$FIREBASE_STORAGE_BUCKET';
            static const String firebaseApiKey = '$FIREBASE_ANDROID_API_KEY';
            static const String firebaseAppId = '$FIREBASE_MOBILE_SDK_APP_ID';
            static const String androidPackageName = '$FIREBASE_ANDROID_PACKAGE';
          }
          EOF
          echo "✅ secrets.dart injected"
          wc -l lib/core/config/secrets.dart

      - name: Inject nextcloud_config.dart
        run: |
          mkdir -p lib/core/config
          cat > lib/core/config/nextcloud_config.dart <<EOF
          class NextcloudConfig {
            NextcloudConfig._();
            static const String url = '$NEXTCLOUD_URL';
            static const String user = '$NEXTCLOUD_USER';
            static const String password = '$NEXTCLOUD_PASSWORD';
            static bool get isConfigured =>
                url.isNotEmpty && user.isNotEmpty && password.isNotEmpty;
          }
          EOF
          echo "✅ nextcloud_config.dart injected"

      - name: Verify injected files
        run: |
          test -f android/app/build.gradle                || { echo "❌ build.gradle missing"; exit 1; }
          test -f android/app/google-services.json        || { echo "❌ google-services.json missing"; exit 1; }
          test -f android/app/memochat-release.jks        || { echo "❌ keystore missing"; exit 1; }
          test -f android/key.properties                  || { echo "❌ key.properties missing"; exit 1; }
          test -f lib/core/config/secrets.dart            || { echo "❌ secrets.dart missing"; exit 1; }
          test -f lib/core/config/nextcloud_config.dart   || { echo "❌ nextcloud_config.dart missing"; exit 1; }
          echo "✅ All injected files verified"

      # ═══════════════════════════════════════════════════════
      # Analysis & Tests
      # ═══════════════════════════════════════════════════════
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test --no-pub --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # ═══════════════════════════════════════════════════════
      # Build
      # ═══════════════════════════════════════════════════════
      - name: Build Universal APK
        run: |
          flutter build apk --release --no-pub \
            --dart-define=FIREBASE_ANDROID_API_KEY=$FIREBASE_ANDROID_API_KEY \
            --dart-define=NEXTCLOUD_URL=$NEXTCLOUD_URL \
            --dart-define=NEXTCLOUD_USER=$NEXTCLOUD_USER \
            --dart-define=NEXTCLOUD_PASSWORD=$NEXTCLOUD_PASSWORD \
            --dart-define=LIVEKIT_URL=$LIVEKIT_URL \
            --dart-define=LIVEKIT_API_KEY=$LIVEKIT_API_KEY

      - name: Build Split APKs
        run: |
          flutter build apk --release --split-per-abi --no-pub \
            --dart-define=FIREBASE_ANDROID_API_KEY=$FIREBASE_ANDROID_API_KEY \
            --dart-define=NEXTCLOUD_URL=$NEXTCLOUD_URL \
            --dart-define=NEXTCLOUD_USER=$NEXTCLOUD_USER \
            --dart-define=NEXTCLOUD_PASSWORD=$NEXTCLOUD_PASSWORD \
            --dart-define=LIVEKIT_URL=$LIVEKIT_URL \
            --dart-define=LIVEKIT_API_KEY=$LIVEKIT_API_KEY

      - name: Build App Bundle
        run: |
          flutter build appbundle --release --no-pub \
            --dart-define=FIREBASE_ANDROID_API_KEY=$FIREBASE_ANDROID_API_KEY \
            --dart-define=NEXTCLOUD_URL=$NEXTCLOUD_URL \
            --dart-define=NEXTCLOUD_USER=$NEXTCLOUD_USER \
            --dart-define=NEXTCLOUD_PASSWORD=$NEXTCLOUD_PASSWORD \
            --dart-define=LIVEKIT_URL=$LIVEKIT_URL \
            --dart-define=LIVEKIT_API_KEY=$LIVEKIT_API_KEY

      - name: Verify signatures
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "→ $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -3
          done

      - name: Show sizes
        run: |
          echo "═══════════════════════════════════"
          ls -lh build/app/outputs/flutter-apk/
          ls -lh build/app/outputs/bundle/release/
          echo "═══════════════════════════════════"

      # ═══════════════════════════════════════════════════════
      # Upload
      # ═══════════════════════════════════════════════════════
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Universal
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Release on tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
