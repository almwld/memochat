# Force re-register: 2026-09-30
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test-build:
    name: Analyze, Test & Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name memochat --org com.memo .

      - name: Configure Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          text = text.replace('namespace = "com.memo.memochat"', 'namespace = "com.memo.app"')
          text = text.replace('namespace "com.memo.memochat"', 'namespace "com.memo.app"')
          lines = text.splitlines()
          output = []
          inserted_min = False
          inserted_desugar = False
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('compileSdk'):
                  output.append('    compileSdk 35')
                  continue
              if stripped.startswith('minSdk'):
                  output.append('        minSdk 23')
                  inserted_min = True
                  continue
              if stripped.startswith('applicationId'):
                  output.append('        applicationId "com.memo.app"')
                  continue
              if stripped == 'compileOptions {':
                  output.append(line)
                  output.append('        coreLibraryDesugaringEnabled true')
                  inserted_desugar = True
                  continue
              output.append(line)
          if not inserted_min:
              for i, line in enumerate(output):
                  if line.strip() == 'defaultConfig {':
                      output.insert(i + 1, '        minSdk 23')
                      inserted_min = True
                      break
          if not inserted_desugar:
              raise SystemExit('Could not locate compileOptions block')
          if not inserted_min:
              raise SystemExit('Could not configure minSdk')
          text = '\n'.join(output) + '\n'
          dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if 'com.android.tools:desugar_jdk_libs:2.1.4' not in text:
              text = text.rstrip() + '\n\ndependencies {\n' + dependency + '\n}\n'
          path.write_text(text)
          PY
          mkdir -p android/app/src/main/kotlin/com/memo/app
          if [ -f android/app/src/main/kotlin/com/memo/memochat/MainActivity.kt ]; then
            sed 's/^package com\.memo\.memochat$/package com.memo.app/' android/app/src/main/kotlin/com/memo/memochat/MainActivity.kt > android/app/src/main/kotlin/com/memo/app/MainActivity.kt
            rm -rf android/app/src/main/kotlin/com/memo/memochat
          fi
          grep -nE 'namespace|applicationId' android/app/build.gradle
          grep -R -n '^package ' android/app/src/main/kotlin || true
          grep -nE 'compileSdk|minSdk|applicationId|coreLibraryDesugaring' android/app/build.gradle

      - name: Configure Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/memochat-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=memochat
          storeFile=app/memochat-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' not in s:
              s = s.replace('android {', '''android {
    def signingPropertiesFile = rootProject.file("key.properties")
    def signingProperties = new Properties()
    if (signingPropertiesFile.exists()) {
        signingProperties.load(new FileInputStream(signingPropertiesFile))
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }''', 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace('buildTypes {', '''buildTypes {
        release {
            signingConfig signingConfigs.release
        }''', 1)
          p.write_text(s)
          PY
          test -f android/app/memochat-release.jks
          test -f android/key.properties
          grep -nE 'signingConfigs|signingConfig|storeFile|keyAlias' android/app/build.gradle

      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "/usr/local/lib/android/sdk/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Force app Android SDK baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('android/app/build.gradle')
          text = app.read_text()
          text = re.sub(r'compileSdk(?:Version)?\s+[^\n]+', 'compileSdk 35', text, count=1)
          text = re.sub(r'targetSdk(?:Version)?\s+[^\n]+', 'targetSdk 35', text, count=1)
          app.write_text(text)
          print("Android app baseline: compileSdk=35, targetSdk=35")
          PY
          grep -nE 'compileSdk|targetSdk|minSdk' android/app/build.gradle

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "GOOGLE_SERVICES_JSON secret is missing"; exit 1; }
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('android/app/google-services.json')
          data = json.loads(p.read_text())
          client = data.get('client', [])
          if not client or client[0].get('client_info', {}).get('android_client_info', {}).get('package_name') != 'com.memo.app':
              raise SystemExit('google-services.json package mismatch')
          print('Firebase package verified: com.memo.app')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Align Android media plugin compile SDKs
        run: |
          LIVEKIT_GRADLE="$(find "$PUB_CACHE/hosted/pub.dev" -path '*/livekit_client-2.2.5/android/build.gradle' -print -quit)"
          WEBRTC_GRADLE="$(find "$PUB_CACHE/hosted/pub.dev" -path '*/flutter_webrtc-0.11.7/android/build.gradle' -print -quit)"
          if [ -z "$LIVEKIT_GRADLE" ] || [ -z "$WEBRTC_GRADLE" ]; then echo "Expected pinned LiveKit/WebRTC Android build files were not found"; exit 1; fi
          sed -i 's/compileSdkVersion 30/compileSdkVersion 35/' "$LIVEKIT_GRADLE"
          sed -i 's/compileSdkVersion 31/compileSdkVersion 35/' "$WEBRTC_GRADLE"
          grep -nE 'compileSdkVersion|minSdkVersion' "$LIVEKIT_GRADLE"
          grep -nE 'compileSdkVersion|minSdkVersion' "$WEBRTC_GRADLE"

      - name: Generate launcher icons
        run: |
          mkdir -p build/icon
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon/icon_app.svg -o assets/icon/icon_app.png
          dart run flutter_launcher_icons

      - name: Format Dart sources
        run: dart format lib/ test/

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Setup Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test Firestore Security Rules
        run: bash rules-tests/ci.sh

      - name: Restore Java 17 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Test
        run: flutter test --no-pub --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build Fat APK (universal)
        env:
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: flutter build apk --release --no-pub --dart-define=FIREBASE_ANDROID_API_KEY=$FIREBASE_ANDROID_API_KEY

      - name: Build Split APKs (per ABI)
        env:
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: flutter build apk --release --split-per-abi --no-pub --dart-define=FIREBASE_ANDROID_API_KEY=$FIREBASE_ANDROID_API_KEY

      - name: Build App Bundle (production)
        env:
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: flutter build appbundle --release --no-pub --dart-define=FIREBASE_ANDROID_API_KEY=$FIREBASE_ANDROID_API_KEY

      - name: Show artifact sizes
        run: |
          echo "Artifact sizes:"
          ls -lh build/app/outputs/flutter-apk/
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Appetize cloud test
        id: appetize
        if: success()
        continue-on-error: true
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_KEY }}
          appFile: build/app/outputs/flutter-apk/app-release.apk
          platform: android
          note: memochat GitHub Actions build ${{ github.run_number }}

      - name: Generate Build summary
        if: always()
        env:
          APPETIZE_RESULT: ${{ steps.appetize.outcome }}
          APPETIZE_PUBLIC_KEY: ${{ steps.appetize.outputs.publicKey }}
        run: |
          {
            echo '# Build summary'
            echo
            echo '## Appetize cloud test'
            echo
            if [ "$APPETIZE_RESULT" = "success" ] && [ -n "$APPETIZE_PUBLIC_KEY" ]; then
              echo '✅ Appetize upload: successful'
              echo
              echo "### [Open MemoChat in Appetize](https://appetize.io/app/$APPETIZE_PUBLIC_KEY)"
              echo
              echo 'Job summary generated at run-time'
            else
              echo '⚠️ Appetize cloud test was not completed.'
              echo
              echo 'The APK build and GitHub artifacts are still available above.'
              echo
              echo 'Job summary generated at run-time'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
