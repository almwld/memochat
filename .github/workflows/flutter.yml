name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

  # Runtime configuration is supplied only through GitHub Actions Secrets.
  # Never place credentials, private keys, or service passwords in this workflow.
  LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
  LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
  LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
  NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
  NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
  NEXTCLOUD_PASSWORD: ${{ secrets.NEXTCLOUD_PASSWORD }}
  FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_MOBILE_SDK_APP_ID: ${{ secrets.FIREBASE_MOBILE_SDK_APP_ID }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_ANDROID_PACKAGE: ${{ secrets.FIREBASE_ANDROID_PACKAGE }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

jobs:
  analyze-test-build:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ═══════════════════════════════════════════════════
      # 1️⃣ Setup
      # ═══════════════════════════════════════════════════
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ═══════════════════════════════════════════════════
      # 2️⃣ Inject secrets (from env above)
      # ═══════════════════════════════════════════════════
      - name: Inject google-services.json
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          echo "✅ google-services.json injected"
          grep -c "certificate_hash" android/app/google-services.json

      - name: Inject release keystore
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/memochat-release.jks
          test -s android/app/memochat-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/memochat-release.jks
          EOF

          echo "✅ keystore + key.properties injected"
          ls -lh android/app/memochat-release.jks

      - name: Inject secrets.dart
        run: |
          mkdir -p lib/core/config
          cat > lib/core/config/secrets.dart <<EOF
          class Secrets {
            Secrets._();

            static const String livekitUrl = '$LIVEKIT_URL';
            static const String livekitApiKey = '$LIVEKIT_API_KEY';
            static const String livekitApiSecret = '$LIVEKIT_API_SECRET';

            static const String nextcloudUrl = '$NEXTCLOUD_URL';
            static const String nextcloudUser = '$NEXTCLOUD_USER';
            static const String nextcloudPassword = '$NEXTCLOUD_PASSWORD';

            static const String firebaseProjectId = '$FIREBASE_PROJECT_ID';
            static const String firebaseStorageBucket = '$FIREBASE_STORAGE_BUCKET';
            static const String firebaseApiKey = '$FIREBASE_API_KEY';
            static const String firebaseAppId = '$FIREBASE_MOBILE_SDK_APP_ID';
            static const String androidPackageName = '$FIREBASE_ANDROID_PACKAGE';
          }
          EOF
          echo "✅ secrets.dart injected"
          wc -l lib/core/config/secrets.dart

      - name: Verify Android project
        run: |
          test -f android/app/build.gradle         || { echo "❌ android/app/build.gradle missing"; exit 1; }
          test -f android/app/google-services.json || { echo "❌ google-services.json missing"; exit 1; }
          test -f android/app/memochat-release.jks || { echo "❌ keystore missing"; exit 1; }
          test -f android/key.properties           || { echo "❌ key.properties missing"; exit 1; }
          test -f lib/core/config/secrets.dart     || { echo "❌ secrets.dart missing"; exit 1; }
          echo "✅ All injected files verified"

      # ═══════════════════════════════════════════════════
      # 3️⃣ Analysis & Tests
      # ═══════════════════════════════════════════════════
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test --no-pub --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # ═══════════════════════════════════════════════════
      # 4️⃣ Build
      # ═══════════════════════════════════════════════════
      - name: Build Universal APK
        run: flutter build apk --release --no-pub

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Build App Bundle
        run: flutter build appbundle --release --no-pub

      - name: Verify signatures
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "→ $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -3
          done

      - name: Show sizes
        run: |
          echo "═══════════════════════════════════"
          ls -lh build/app/outputs/flutter-apk/
          ls -lh build/app/outputs/bundle/release/
          echo "═══════════════════════════════════"

      # ═══════════════════════════════════════════════════
      # 5️⃣ Upload
      # ═══════════════════════════════════════════════════
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Universal
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      # ═══════════════════════════════════════════════════
      # 6️⃣ Release on tags
      # ═══════════════════════════════════════════════════
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
