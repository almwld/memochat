                "package_name": "com.memo.app",
                "certificate_hash": "6110569ed024c3da2a05eef4ac764ad36f898371"
              }
            },
            {
              "client_id": "448753275014-7hmiihl18tpi968v5b7gkejfl43c613r.apps.googleusercontent.com",
