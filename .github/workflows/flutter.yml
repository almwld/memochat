              "android_info": {
                "package_name": "com.memo.app",
                "certificate_hash": "5b251d8b069b6763e8fa6566456d038eeb804b53"
              }
            },
            {
              "client_id": "448753275014-df58mhe0nlt20v6q2ici83f8qt5vme5q.apps.googleusercontent.com",
              "client_type": 1,
              "android_info": {
                "package_name": "com.memo.app",
                "certificate_hash": "6110569ed024c3da2a05eef4ac764ad36f898371"
              }
            },
            {
              "client_id": "448753275014-7hmiihl18tpi968v5b7gkejfl43c613r.apps.googleusercontent.com",
