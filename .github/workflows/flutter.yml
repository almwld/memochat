name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

  # ═══════════════════════════════════════════════════════════
  # 🔐 المفاتيح المضمّنة (للاختبار فقط)
  # ═══════════════════════════════════════════════════════════
  LIVEKIT_URL: 'wss://memo-2jv45qyl.livekit.cloud'
  LIVEKIT_API_KEY: '${{ secrets.LIVEKIT_API_KEY }}'
  LIVEKIT_API_SECRET: '${{ secrets.LIVEKIT_API_SECRET }}'

  NEXTCLOUD_URL: 'https://noa.it.tabdigital.cloud'
  NEXTCLOUD_USER: 'Binobaeid@gmail.com'
  NEXTCLOUD_PASSWORD: '${{ secrets.NEXTCLOUD_PASSWORD }}'

  FIREBASE_PROJECT_NUMBER: '448753275014'
  FIREBASE_PROJECT_ID: 'memo-f97b5'
  FIREBASE_STORAGE_BUCKET: 'memo-f97b5.firebasestorage.app'
  FIREBASE_MOBILE_SDK_APP_ID: '1:448753275014:android:e4dedb02a3b10cce9f0107'
  FIREBASE_API_KEY: '${{ secrets.FIREBASE_ANDROID_API_KEY }}'
  FIREBASE_ANDROID_PACKAGE: 'com.memo.app'

  KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}'
  KEY_PASSWORD: '${{ secrets.KEY_PASSWORD }}'
  KEY_ALIAS: 'memochat'

  # ═══════════════════════════════════════════════════════════
