  FIREBASE_STORAGE_BUCKET: 'memo-f97b5.firebasestorage.app'
  FIREBASE_MOBILE_SDK_APP_ID: '1:448753275014:android:e4dedb02a3b10cce9f0107'
  FIREBASE_ANDROID_API_KEY: 'AIzaSyCSamhS5nlR4yqHQBunfk61b9GwkZHntbQ'
  FIREBASE_ANDROID_PACKAGE: 'com.memo.app'

  # Keystore
  KEYSTORE_PASSWORD: 'Kk12345678'
