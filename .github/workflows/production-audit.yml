name: Production Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-audit:
    name: Production Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js for backend validation
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: livekit-server/package.json
      - name: Validate LiveKit and notification backend
        run: |
          npm install --prefix livekit-server --omit=dev --no-audit --no-fund
          node --check livekit-server/server.js
          node --check livekit-server/notification-server.js
          node --check functions/index.js
          node --check functions/chat_notifications.js
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Production guard
        run: bash tool/production_guard.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        continue-on-error: true
        run: |
          dart format --output=none lib test
          echo "Formatting is advisory here; static analysis and tests remain blocking."
      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test --no-pub
