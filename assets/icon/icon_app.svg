<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <title>MemoChat</title>
  <desc>Two clean overlapping white chat bubbles on a teal rounded-square background.</desc>

  <!-- Solid background: deliberately no gradients, glass, glow, shadows, or decorative effects. -->
  <rect width="500" height="500" rx="145" fill="#0D8274"/>

  <!-- Front / left bubble. Geometry is optically balanced for both 96px auth display
       and 1024px launcher rendering. -->
  <path
    fill="#FFFFFF"
    d="M180 135h90a25 25 0 0 1 25 25v70a25 25 0 0 1-25 25h-70l-45 45v-45a25 25 0 0 1-25-25v-70a25 25 0 0 1 25-25h25Z"
  />

  <!-- Rear / right bubble. Kept visually lighter through overlap only; no opacity. -->
  <path
    fill="#FFFFFF"
    d="M318 168a28 28 0 0 1 28 28v166l-44-44h-82a28 28 0 0 1-28-28v-13h101a24 24 0 0 0 24-24v-85Z"
  />
</svg>
