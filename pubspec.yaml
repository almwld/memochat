name: memochat
description: A modern cross-platform messaging application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_bloc: ^8.1.6
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.2
  cloud_firestore: ^6.3.0
  firebase_messaging: 16.2.0
  flutter_local_notifications: ^19.5.0
  audioplayers: ^6.1.0
  just_audio: ^0.9.46
  vibration: ^2.0.1
  sensors_plus: ^6.1.2
  livekit_client: 2.2.5
  flutter_webrtc: 0.11.7
  shared_preferences: ^2.3.5
  file_picker: ^9.2.3
  http: ^1.2.2
  dio: ^5.8.0+1
  equatable: ^2.0.7
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  image_picker: ^1.1.2
  image_editor_plus: ^1.0.6
  flutter_contacts: ^1.1.9+2
  app_links: 6.2.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  record: 5.2.1
  sqflite: ^2.4.1
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  path: ^1.9.0
  firebase_storage: ^13.0.4
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  share_plus: ^10.1.4
  flutter_secure_storage: ^9.2.4
  libsignal_protocol_dart: 0.7.1
  cryptography: 2.8.1
  fluttertoast: ^8.2.12
  photo_manager: 3.7.1
  workmanager: ^0.6.0
  shimmer: ^3.0.0
  wakelock_plus: 1.3.2
  permission_handler: ^12.0.1
  flame: ^1.31.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icon/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon_app.png
  min_sdk_android: 23

dependency_overrides:
  protobuf: ^3.0.0
  geolocator_android: 4.6.1
  package_info_plus: 8.3.1
  record_android: 1.3.1
  record_platform_interface: 1.2.0
  font_awesome_flutter: 10.8.0
  hand_signature: 3.0.3
